[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anvil-gp"
version = "0.1.0.dev0"
description = "Batched Gaussian-process likelihoods (celerite-class state-space kernels) for the anvil MCMC engine on Apple Silicon, built on MLX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Kipping" }]
dependencies = [
    "mlx>=0.30",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "celerite2>=0.3",     # fp64 value oracle (CPU)
    "jax[cpu]>=0.4",      # celerite2.jax gradient oracle (M4)
]

[tool.hatch.build.targets.wheel]
packages = ["anvilgp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running statistical tests (deselect with '-m \"not slow\"')",
]
