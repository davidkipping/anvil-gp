[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anvil-gp"
version = "0.1.0.dev0"
description = "Batched Gaussian-process likelihoods (celerite-class state-space kernels) for the anvil MCMC engine on Apple Silicon, built on MLX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Kipping" }]
dependencies = [
    "mlx>=0.30",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "celerite2>=0.3",     # fp64 value oracle (CPU)
    "mpmath>=1.3",        # arbitrary-precision oracle for special.py
    "scipy>=1.10",        # expm, the brute-force Gaussian integral
]
# `anvil` itself is deliberately NOT a dependency: it is imported lazily and
# only by `anvilgp.anvil`, so the package tests without it.  Install it
# separately for the integration tests (they skip if it is absent).
#
# NOTE ON MLX: the workarounds in elements._pairs and the compiled-gradient
# limitation are specific to MLX 0.32.2 and are pinned by regression tests
# that assert the *buggy* behaviour, so they will fail loudly when MLX fixes
# them.  That is intentional -- no upper bound here, but expect test
# failures rather than silence on a newer MLX.

[tool.hatch.build.targets.wheel]
packages = ["anvilgp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running statistical tests (deselect with '-m \"not slow\"')",
]
